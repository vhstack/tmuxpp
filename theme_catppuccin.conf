# Theme Catppuccin Mocha
#
# Braucht als einziges Theme ein Plugin. Es wird ohne Plugin-Manager einmalig
# von Hand geklont (gepinnt auf v2.1.3), danach Prefix + r:
#
#   git clone --depth 1 -b v2.1.3 https://github.com/catppuccin/tmux ~/.tmux/plugins/tmux
#   rm -rf ~/.tmux/plugins/tmux/.git

# Catppuccin Anpassungen
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"

# Optionale Icons  🟢 🔴 🟣 ⚪ ⚫
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_inactive_style "dim"

# Run Cattpuccin
# Fehlt das Plugin (noch nicht geklont), waere der Aufruf ein 127
# (command not found) -- daher vorher pruefen, ob die Datei da ist.
if-shell '[ -r ~/.tmux/plugins/tmux/catppuccin.tmux ]' 'run ~/.tmux/plugins/tmux/catppuccin.tmux'

# Definiere Status Line
set -g status-justify centre
set -g status-right-length 100
set -g status-left-length 100

# Linke Seite
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{E:@catppuccin_status_user}"

# Rechte Seite
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Overlays und Menues in Mocha-Farben (tmux-Werksfarben sind gelb/gruen/blau).
# Literale Werte statt @thm_*: ohne das Plugin waeren sie leer.

# Prompt und Meldungen in Peach, nicht im leuchtenden Mauve.
set -g message-style "bg=#313244,fg=#fab387,bold"
set -g message-command-style "bg=#313244,fg=#cdd6f4,bold"

# Copy-Mode-Auswahl
set -g mode-style "bg=#cba6f7,fg=#11111b,bold"

# Dev-Snapshots "next-3.6" (Nov 2024 - Jun 2025) expandieren den
# mode-style-Fallback dieser Optionen nicht (tmux-Issue 4533): Auswahl
# bliebe unsichtbar. -q schluckt "invalid option" auf tmux < 3.6.
set -gq copy-mode-selection-style "#{E:mode-style}"
set -gq copy-mode-position-style  "#{E:mode-style}"

# Farbwerte statt Styles -- hier sind keine Formate erlaubt ("bad colour")
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#cba6f7"
set -g clock-mode-colour "#a6e3a1"

# Copy-Mode-Treffer und Marke (ab tmux 3.2)
%if "#{>=:#{version},3.2}"
set -g copy-mode-match-style "bg=#89b4fa,fg=#11111b"
set -g copy-mode-current-match-style "bg=#fab387,fg=#11111b,bold"
set -g copy-mode-mark-style "bg=#f38ba8,fg=#11111b,bold"
%endif

# Popups (ab tmux 3.3), Flaeche transparent wie die Menues
%if "#{>=:#{version},3.3}"
set -g popup-style "bg=default,fg=#cdd6f4"
set -g popup-border-style "fg=#6c7086"
%endif

# Kontextmenues (ab tmux 3.4): Prefix + < / >, Rechtsklick auf die
# Statusleiste. Flaeche transparent, nur die markierte Zeile solide.
%if "#{>=:#{version},3.4}"
set -g menu-style "bg=default,fg=#cdd6f4"
set -g menu-selected-style "bg=#cba6f7,fg=#11111b,bold"
set -g menu-border-style "fg=#6c7086"
set -g menu-border-lines rounded
%endif

# Indexfarben, kein Hex -- mit Truecolor wird der Strich breiter als 1 Pixel.
# Beide Kanten, weil bei zwei Panes nur die Haelfte aktiv gefaerbt wird.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour65}}"

# Prompt-Symbole (Prefix + , / $ / +), Nerd Font -- das Plugin setzt in der
# Statusleiste ohnehin Nerd-Glyphen voraus.
set -g @icon_window ""
set -g @icon_session "⌘"
