# Theme vhstack ascii Tmux Version >= 3.2

# Allgemeiner Stil Status Leiste
set -g status-justify centre
set -g status-style bg=#181825,fg=colour189
set -g status-left-length 100
set -g status-right-length 100

# Farben vhstack/catppuccin
set -g @ctp_surface_1 "#313244"
set -g @ctp_fg "#cdd6f4"
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_mauve "#605dae"
set -g @ctp_crust "#eeeefe"
set -g @ctp_surface0 "#313244"
set -g @ctp_text "#cdd6f4"

set -g @ctp_session "#fab387"
set -g @ctp_id "#a6e3a1"
set -g @ctp_count "#89b4fa"
set -g @ctp_date "#fab387"
set -g @ctp_time "#a6e3a1"
set -g @ctp_user "#89b4fa"

# Sektion Symbol Farben
set -g @ctp_symbol_session "#fab387"
set -g @ctp_symbol_id "#a6e3a1"
set -g @ctp_symbol_count "#89b4fa"
set -g @ctp_symbol_date "#fab387"
set -g @ctp_symbol_time "#a6e3a1"
set -g @ctp_symbol_user "#89b4fa"

# minimalistisch, aber stilvoll
set -g status-left "#[bg=#{@ctp_surface0},fg=#{@ctp_symbol_session}] #[bg=#{@ctp_surface0},fg=#{@ctp_session}] #S #[bg=#{@ctp_surface0},fg=#{@ctp_symbol_id}] #[bg=#{@ctp_surface0},fg=#{@ctp_id}]#I #[bg=#{@ctp_surface0},fg=#{@ctp_symbol_count}] #[bg=#{@ctp_surface0},fg=#{@ctp_count}]###{session_windows} #[fg=#{@ctp_surface0},bg=default] "
set -g status-right "#[fg=#{@ctp_surface0},bg=default] #[bg=#{@ctp_surface0},fg=#{@ctp_symbol_date}] #[bg=#{@ctp_surface0},fg=#{@ctp_date}] %d.%m.%Y #[bg=#{@ctp_surface0},fg=#{@ctp_symbol_time}] #[bg=#{@ctp_surface0},fg=#{@ctp_time}]%H:%M:%S #[bg=#{@ctp_surface0},fg=#{@ctp_symbol_user}] #[bg=#{@ctp_surface0},fg=#{@ctp_user}]#(whoami)@#H "

# Rechteckig: Aktives,inaktives und Aktivität Fenster
set -g window-status-current-format '#[fg=#{@ctp_mauve},bg=default]#[fg=#{@ctp_crust},bg=#{@ctp_mauve},bold] #I #W #[fg=#{@ctp_mauve},bg=default]'
set -g window-status-format '#[fg=#{@ctp_surface0},bg=default]#[fg=#{@ctp_text},bg=#{@ctp_surface0}] #I #W #[fg=#{@ctp_surface0},bg=default]'
#set -g window-status-activity-format '#[fg=#{@ctp_overlay0},bg=default]#[fg=#{@ctp_text},bg=#{@ctp_overlay0}] #I #W #[fg=#{@ctp_overlay0},bg=default]'

# Trennung zwischen Fenstern
set -g window-status-separator " "

# Statusleiste Hintergrund (default=transparent)
set -g status-style "bg=#181825"

# Overlays und Menues in Theme-Farben (tmux-Werksfarben sind gelb/gruen/blau).

# Prompt und Meldungen; nicht das Mauve der Auswahl (Kontrast nur 5:1).
set -g message-style "bg=#{@ctp_surface0},fg=#{@ctp_session},bold"
set -g message-command-style "bg=#{@ctp_surface0},fg=#{@ctp_crust},bold"

# Copy-Mode-Auswahl wie der aktive Fenster-Button
set -g mode-style "bg=#{@ctp_mauve},fg=#{@ctp_crust},bold"

# Farbwerte statt Styles -- hier sind keine Formate erlaubt ("bad colour")
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#605dae"
set -g clock-mode-colour "#a6e3a1"

# Copy-Mode-Treffer und Marke (ab tmux 3.2)
%if "#{>=:#{version},3.2}"
set -g copy-mode-match-style "bg=#{@ctp_count},fg=#{@ctp_surface0}"
set -g copy-mode-current-match-style "bg=#{@ctp_session},fg=#{@ctp_surface0},bold"
set -g copy-mode-mark-style "bg=#{@ctp_mauve},fg=#{@ctp_crust},bold"
%endif

# Popups (ab tmux 3.3), Flaeche transparent wie die Menues
%if "#{>=:#{version},3.3}"
set -g popup-style "bg=default,fg=#{@ctp_text}"
set -g popup-border-style "fg=#{@ctp_overlay0}"
%endif

# Kontextmenues (ab tmux 3.4): Prefix + < / >, Rechtsklick auf die
# Statusleiste. Flaeche transparent, markierte Zeile solide, Rahmen in ASCII.
%if "#{>=:#{version},3.4}"
set -g menu-style "bg=default,fg=#{@ctp_text}"
set -g menu-selected-style "bg=#{@ctp_mauve},fg=#{@ctp_crust},bold"
set -g menu-border-style "fg=#{@ctp_overlay0}"
set -g menu-border-lines simple
%endif

# Indexfarben, kein Hex -- mit Truecolor wird der Strich breiter als 1 Pixel.
# Beide Kanten, weil bei zwei Panes nur die Haelfte aktiv gefaerbt wird.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour65}}"

# Prompt-Symbole (Prefix + , / $ / +), ASCII -- dieses Theme laeuft ohne
# Nerd Font.
set -g @icon_window "[W]"
set -g @icon_session "[S]"
