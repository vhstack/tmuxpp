# Tmux Konfiguration 
# Author: Viktor Herzog
# GitHub: https://github.com/vhstack/tmuxpp

# Aktuelles Theme (vhstack,vhstack_lite,catppuccin)
set -g @theme "vhstack"

# Terminal auf True Color setzen (24-bit)
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"

# Globale Prefix Taste von 'C-b' zu 'C-a' setzen
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Notifications
setw -g monitor-activity off
set -g visual-activity off
set -g bell-action none

# Tmux Terminal Tweaks
set -g renumber-windows on      
set -g aggressive-resize off     
set -g escape-time 10
set -g focus-events off
set -g xterm-keys on
set -g history-limit 50000
set -g display-time 2000

# Automatisch Fenster umbenennen
setw -g automatic-rename on

# Beim Umbenennen mit dem leeren Feld starten
unbind ,
bind , command-prompt -I "" "rename-window '%%'"

# Sortieren nach Name
bind s choose-tree -sZ -O name

# Index ab 1 (statt 0)
set -g base-index 1
setw -g pane-base-index 1

# Fenster splitten mit | und -
bind | split-window -h
bind - split-window -v
bind b break-pane
unbind '"'
unbind %

# Reload Konfiguration
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Neue Session erzeugen
bind + command-prompt -p "Session Name:" "new-session -s '%%'"

# Zwischen Fenstern mit Alt+Richtung wechseln
bind -n M-Right next-window
bind -n M-Left previous-window

# Fenster verschieben
bind -n C-M-Right swap-window -t +1 \; select-window -t +1
bind -n C-M-Left swap-window -t -1 \; select-window -t -1

# Fenster vergrößern/verkleinern
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r z resize-pane -Z

# Scroll Copy Modus mit Strg-PageUp
bind -n C-PageUp copy-mode

# Clipboard: OSC 52 an das Terminal (greift auch über SSH)
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# clipboard.sh liegt neben dieser Konfiguration. Der Pfad wird beim Laden
# ermittelt, damit der Clone auch ausserhalb von ~/.tmux liegen darf.
set -g @clip 'sh ~/.tmux/clipboard.sh'
run -b 'c="#{config_files}"; c=${c%%,*}; [ -n "$c" ] && d=$(dirname "$(readlink -f "$c")") && [ -r "$d/clipboard.sh" ] && tmux set -g @clip "sh $d/clipboard.sh"'

# Maus: Mausrad scrollt im History-Buffer (springt automatisch in den Copy-Mode)
setw -g mouse on

# Maussteuerung an/aus
bind m set -g mouse \; display-message "Maus #{?mouse,an,aus}"

# 3 Zeilen pro Rasterung statt 5 (ruhigeres Scrollen)
bind -T copy-mode-vi WheelUpPane   send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 scroll-down

# Vim Modus
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel '#{@clip} copy'

# Kopieren per Maus ohne Shift: Ziehen markiert, Loslassen kopiert
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{@clip} copy'

# Wortgrenzen: der tmux-Standard trennt an jedem Satzzeichen, ein Doppelklick
# auf 'xyz.sh' liefert damit nur 'xyz'. Punkt, Bindestrich, Schraegstrich und
# Doppelpunkt bleiben deshalb Teil des Wortes, sodass Dateinamen, Pfade und
# URLs vollstaendig markiert werden.
set -g word-separators " \"'()[]{}<>,;|&"

# Doppelklick = Wort, Dreifachklick = Zeile (jeweils direkt kopiert).
# Das leere 'run -d 0.2' ist nur eine Pause: ohne sie markiert und kopiert tmux
# im selben Durchlauf, die Markierung wird also nie gezeichnet.
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; run -d 0.2 \; send -X copy-pipe-and-cancel '#{@clip} copy'
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; run -d 0.2 \; send -X copy-pipe-and-cancel '#{@clip} copy'

# Ausserhalb des Copy-Mode: Apps mit eigener Mausbehandlung (vim, htop)
# bekommen den Klick durchgereicht, sonst wird markiert und kopiert.
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ copy-mode -H ; send -X select-word ; run -d 0.2 ; send -X copy-pipe-and-cancel '#{@clip} copy' }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ copy-mode -H ; send -X select-line ; run -d 0.2 ; send -X copy-pipe-and-cancel '#{@clip} copy' }

# Rechtsklick fuegt aus der Zwischenablage ein (tmux-Kontextmenue bleibt auf prefix + >).
# Apps mit eigener Mausbehandlung (vim, htop) bekommen das Ereignis weiter durchgereicht.
bind -n MouseDown3Pane if -Ft= '#{||:#{mouse_any_flag},#{pane_in_mode}}' \
	'send -M' \
	'run -b "#{@clip} paste #{pane_id}"'

# Nicht automatisch umbenennen
set-option -g allow-rename off

# 1-Sekunden Aktualisierung
set -g status-interval 1

# End/Pos1 Taste nach xterm Standard
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Liste Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Theme laden
if -F '#{==:#{@theme},vhstack}'    'source-file ~/.tmux/theme_vhstack.conf'
if -F '#{==:#{@theme},vhstack_lite}' 'source-file ~/.tmux/theme_vhstack_lite.conf'
if -F '#{==:#{@theme},catppuccin}' 'source-file ~/.tmux/theme_catppuccin.conf'

# TPM Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
