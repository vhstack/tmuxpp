# Tmux Konfiguration 
# Author: Viktor Herzog
# GitHub: https://github.com/vhstack/tmuxpp

# Aktuelles Theme (vhstack,vhstack_lite,catppuccin)
set -g @theme "vhstack"

# Terminal auf True Color setzen (24-bit)
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"

# Globale Prefix Taste von 'C-b' zu 'C-a' setzen
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Notifications
setw -g monitor-activity off
set -g visual-activity off
set -g bell-action none

# Tmux Terminal Tweaks
set -g renumber-windows on      
set -g aggressive-resize off     
set -g escape-time 10
set -g focus-events off
set -g xterm-keys on
set -g history-limit 50000
set -g display-time 2000

# Automatisch Fenster umbenennen
setw -g automatic-rename on

# Explizit setzen: sonst leitet tmux es aus $EDITOR/$VISUAL ab ("vi" steckt
# auch in nvim), und dann schaltet Esc den Prompt nur in den Kommandomodus,
# statt ihn abzubrechen.
set -g status-keys emacs

# Fallback-Symbole der Prompts; die Themes ueberschreiben sie (werden am
# Dateiende gesourct). Hier kein Nerd-Font-Glyph: Bindings gelten
# themeunabhaengig, und vhstack_lite laeuft ohne Patch-Schrift.
set -g @icon_window "▣"
set -g @icon_session "⌘"

# Umbenennen mit dem aktuellen Namen vorbefuellt (Strg+U leert das Feld).
# "--" verhindert "unknown flag" bei Namen mit fuehrendem Bindestrich.
unbind ,
bind , command-prompt -I "#W" -p " #{@icon_window}" "rename-window -- '%%'"
unbind '$'
bind '$' command-prompt -I "#S" -p " #{@icon_session}" "rename-session -- '%%'"

# Sortieren nach Name
bind s choose-tree -sZ -O name

# Index ab 1 (statt 0)
set -g base-index 1
setw -g pane-base-index 1

# Fenster splitten mit | und -
bind | split-window -h
bind - split-window -v
bind b break-pane
unbind '"'
unbind %

# Reload Konfiguration
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Neue Session erzeugen
bind + command-prompt -p " #{@icon_session} session name:" "new-session -s '%%'"

# Zwischen Fenstern mit Alt+Richtung wechseln
bind -n M-Right next-window
bind -n M-Left previous-window

# Fenster verschieben
bind -n C-M-Right swap-window -t +1 \; select-window -t +1
bind -n C-M-Left swap-window -t -1 \; select-window -t -1

# Fenster vergrößern/verkleinern
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r z resize-pane -Z

# Scroll Copy Modus mit Strg-PageUp
bind -n C-PageUp copy-mode

# Clipboard: OSC 52 an das Terminal (greift auch über SSH)
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
# WSL: Interop-Socket vom Client übernehmen, der des Servers stirbt mit dem
# ersten Fenster (clipboard.sh)
set -ga update-environment ' WSL_INTEROP'

# clipboard.sh liegt neben dieser Konfiguration. Der Pfad wird beim Laden
# ermittelt, damit der Clone auch ausserhalb von ~/.tmux liegen darf.
# #{config_files} zaehlt je nach tmux-Version alle Kandidaten auf, auch nicht
# vorhandene wie /etc/tmux.conf -- daher die Schleife bis zum ersten Treffer.
# Das abschliessende true haelt den Rueckgabewert bei 0, sonst meldet tmux bei
# Prefix + r den Abbruch der Suche als Fehler.
set -g @clip 'sh ~/.tmux/clipboard.sh'
run -b 'c="#{config_files}"; while [ -n "$c" ]; do f=${c%%,*}; case "$c" in *,*) c=${c#*,} ;; *) c= ;; esac; [ -f "$f" ] || continue; d=$(dirname "$(readlink -f "$f")"); [ -r "$d/clipboard.sh" ] && { tmux set -g @clip "sh $d/clipboard.sh"; break; }; done; true'

# Maus: Mausrad scrollt im History-Buffer (springt automatisch in den Copy-Mode)
setw -g mouse on

# Maussteuerung an/aus
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"

# 3 Zeilen pro Rasterung statt 5 (ruhigeres Scrollen)
bind -T copy-mode-vi WheelUpPane   send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 scroll-down

# Mausrad: Apps mit eigener Mausbehandlung (htop, vim mit mouse=a) bekommen
# das Rad durchgereicht; Vollbild-Apps ohne Maus (less, man, nvim mit mouse=)
# erhalten stattdessen 3x Pfeiltaste; sonst wie gehabt Scroll im
# tmux-History-Buffer (Copy-Mode, -e verlaesst ihn unten automatisch).
bind -n WheelUpPane if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ if -Ft= '#{alternate_on}' { send -N3 Up } { copy-mode -e ; send -M } }
bind -n WheelDownPane if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ if -Ft= '#{alternate_on}' { send -N3 Down } { send -M } }

# Vim Modus
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel '#{@clip} copy'

# Kopieren per Maus ohne Shift: Ziehen markiert, Loslassen kopiert
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{@clip} copy'

# Wortgrenzen: der tmux-Standard trennt an jedem Satzzeichen, ein Doppelklick
# auf 'xyz.sh' liefert damit nur 'xyz'. Punkt, Bindestrich, Schraegstrich und
# Doppelpunkt bleiben deshalb Teil des Wortes, sodass Dateinamen, Pfade und
# URLs vollstaendig markiert werden.
set -g word-separators " \"'()[]{}<>,;|&"

# Doppelklick = Wort, Dreifachklick = Zeile (jeweils direkt kopiert).
#
# Markieren und Kopieren sind getrennt: SecondClick1Pane feuert sofort beim
# zweiten Klick und markiert nur -- die Markierung erscheint damit ohne
# Verzoegerung. Das Kopieren uebernimmt DoubleClick1Pane, das tmux erst nach
# dem internen Klick-Timer ausloest (KEYC_CLICK_TIMEOUT, 300 ms), wenn kein
# dritter Klick mehr gekommen ist. Ein Dreifachklick bricht diesen Timer ab
# und feuert nur TripleClick1Pane -- so wird genau einmal kopiert, und eine
# Markierung im gescrollten Verlauf bleibt bis zum Kopieren an Ort und
# Stelle. (SecondClick selbst kopieren zu lassen sieht verlockend aus,
# kopiert beim Dreifachklick aber erst das Wort und dann die Zeile -- und
# wirft einen im gescrollten Verlauf vor dem dritten Klick aus dem Copy-Mode,
# sodass die falsche Zeile kopiert wird.)
bind -T copy-mode-vi SecondClick1Pane send -X select-word
bind -T copy-mode-vi DoubleClick1Pane send -X copy-pipe-and-cancel '#{@clip} copy'
# Das leere 'run -d 0.1' ist nur eine Pause: ohne sie markiert und kopiert
# tmux im selben Durchlauf, die Markierung wird also nie gezeichnet.
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; run -d 0.1 \; send -X copy-pipe-and-cancel '#{@clip} copy'

# Ausserhalb des Copy-Mode: Apps mit eigener Mausbehandlung (vim, htop)
# bekommen den Klick durchgereicht, sonst wird markiert und kopiert.
# SecondClick oeffnet den Copy-Mode und markiert; das Kopieren erledigt das
# DoubleClick-Binding der copy-mode-vi-Tabelle, denn beim Ablauf des
# Klick-Timers ist der Pane bereits im Copy-Mode. DoubleClick1Pane bleibt
# hier bewusst ungebunden: das synthetische Ereignis reicht tmux nicht an
# die Anwendung weiter (m->ignore), vim & Co. sehen also keine doppelten
# Klicks.
unbind -n DoubleClick1Pane
bind -n SecondClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ copy-mode -H ; send -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ copy-mode -H ; send -X select-line ; run -d 0.1 ; send -X copy-pipe-and-cancel '#{@clip} copy' }

# Ziehen mit der linken Maustaste markiert auch in Vollbild-Apps (nvim, less, ...)
# Markierung ist dabei auf den sichtbaren Bildschirm begrenzt (keine History).
bind -n MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
	{ send -M } \
	{ copy-mode -M }

# Rechtsklick fuegt aus der Zwischenablage ein (tmux-Kontextmenue bleibt auf prefix + >).
# Apps mit eigener Mausbehandlung (vim, htop) bekommen das Ereignis weiter durchgereicht.
bind -n MouseDown3Pane if -Ft= '#{||:#{mouse_any_flag},#{pane_in_mode}}' \
	'send -M' \
	'run -b "#{@clip} paste #{pane_id}"'

# Nicht automatisch umbenennen
set-option -g allow-rename off

# 1-Sekunden Aktualisierung
set -g status-interval 1

# End/Pos1 Taste nach xterm Standard
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Theme laden. Die Konfiguration kommt ohne Plugin-Manager aus; einzig
# catppuccin braucht ein Plugin -- Klon-Hinweis in theme_catppuccin.conf.
if -F '#{==:#{@theme},vhstack}'    'source-file ~/.tmux/theme_vhstack.conf'
if -F '#{==:#{@theme},vhstack_lite}' 'source-file ~/.tmux/theme_vhstack_lite.conf'
if -F '#{==:#{@theme},catppuccin}' 'source-file ~/.tmux/theme_catppuccin.conf'
